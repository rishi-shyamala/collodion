[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dt-ai-helper"
version = "0.1.0"
description = "Local helper service for the collodion darktable AI assistant"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pillow>=10.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "rank-bm25>=0.2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "httpx>=0.27",
]

[project.scripts]
dt-ai-helper = "dt_ai_helper.main:cli"

[tool.setuptools.packages.find]
include = ["dt_ai_helper*"]

# Ship the RAG corpus (helper/dt_ai_helper/data/module_library/*.md) inside
# the wheel -- setuptools does not include non-.py files by default, and the
# corpus used to live outside the package entirely (helper/data/), which
# meant a non-editable install worked but the resulting wheel shipped
# without it (documentation/agent-insights/011-api-contract.md). include_package_data
# plus this package_data entry covers both sdist and wheel builds.
[tool.setuptools.package-data]
dt_ai_helper = ["data/module_library/*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
asyncio_mode = "auto"
