# Expected decode of handwritten_multi_instance.xmp
#
# Hand-authored (not generated by make_fixtures.py) to exercise, in one
# file:
#   - multi-instance collapse: two "exposure" instances (multi_priority 0
#     and 1) plus a second edit to instance 0 that must win over the first
#     (last entry per (operation, multi_priority) wins).
#   - history_end truncation: a 4th history entry ("crop", num=3) exists
#     in the stack but history_end=3 means it is undone and MUST NOT
#     appear in enabled_modules.
#   - plain-hex params (no "gz" prefix) - darktable only compresses params
#     over ~100 bytes by default and the exposure struct is 24 bytes, so
#     this is what a real small-module entry looks like uncompressed.
#
# Params hex was generated with helper/dt_ai_helper/params_codec/exposure.py's
# struct layout via `struct.pack("<iffffi", mode, black, exposure,
# deflicker_percentile, deflicker_target_level, compensate_exposure_bias)`.

history_source: xmp
iop_order: [exposure, exposure, crop]

enabled_modules:
  - op: exposure
    label: exposure
    enabled: true
    multi_name: ""
    multi_priority: 0
    modversion: 6
    params_decoded:
      mode: manual
      black: 0.0
      exposure: 1.25  # last-wins: num=2 (1.25) overrides num=0 (0.5)
      deflicker_percentile: 50.0
      deflicker_target_level: -4.0
      compensate_exposure_bias: false

  - op: exposure
    label: vignette control
    enabled: true
    multi_name: "vignette control"
    multi_priority: 1
    modversion: 6
    params_decoded:
      mode: manual
      black: 0.0
      exposure: -0.25
      deflicker_percentile: 50.0
      deflicker_target_level: -4.0
      compensate_exposure_bias: false

# "crop" (num=3) is intentionally ABSENT: it is at/after history_end=3
# and must be excluded (undone).
