# NOTE TO MAINTAINER: this file is NOT wired up as a live GitHub Actions
# workflow yet. It lives at ci/github-ci.yml instead of
# .github/workflows/ci.yml because the `gh` CLI token this project's agents
# have used so far lacks the `workflow` OAuth scope, and GitHub rejects any
# push containing files under .github/workflows/ from such a token (see
# documentation/agent-insights/002-conventions-for-subagents.md). To enable
# CI for real:
#
#   gh auth refresh -s workflow
#   git mv ci/github-ci.yml .github/workflows/ci.yml
#   git commit -m "ci: enable GitHub Actions workflow"
#   git push
#
# Until then, every agent working on this repo runs the equivalent checks
# locally before opening a PR (see CLAUDE.md's Testing section and
# documentation/agent-insights/002-conventions-for-subagents.md).

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        working-directory: helper
        run: pip install -e ".[dev]"
      - name: Lint (helper + tests)
        working-directory: helper
        run: ruff check . ../tests
      - name: Validate RAG module library
        working-directory: helper
        run: python ../scripts/build_library.py --quiet
      - name: Test
        working-directory: helper
        run: pytest ../tests -q
      - name: Build wheel and verify the RAG corpus ships in it
        working-directory: helper
        run: |
          python -m pip install build
          python -m build --wheel --outdir /tmp/dt-ai-helper-dist
          python - <<'PYEOF'
          import zipfile, glob, sys
          wheel = glob.glob("/tmp/dt-ai-helper-dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as zf:
              corpus_files = [n for n in zf.namelist() if "data/module_library/" in n and n.endswith(".md")]
          if not corpus_files:
              print("ERROR: wheel does not contain the RAG module library", file=sys.stderr)
              sys.exit(1)
          print(f"OK: wheel contains {len(corpus_files)} module library files")
          PYEOF

  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install luacheck
        run: sudo apt-get update && sudo apt-get install -y luarocks && sudo luarocks install luacheck
      - name: Lint Lua
        run: |
          if ls lua/*.lua >/dev/null 2>&1; then
            luacheck lua --globals darktable dt --no-max-line-length
          else
            echo "no lua files yet"
          fi
